# Tells Bing (which also feeds ChatGPT search, Copilot, DuckDuckGo and Yandex via IndexNow) about
# every page that changed in a push to main, so updates are recrawled within hours instead of weeks.
# Google does not support IndexNow; submit the sitemap once in Google Search Console instead.
name: Notify search engines (IndexNow)

on:
  push:
    branches: [main]
  # A page that is never edited is never submitted by the push path above, so it can sit
  # unindexed indefinitely. Once a week, resubmit every URL in the sitemap to close that gap.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: 'Submit every sitemap URL instead of only changed pages'
        type: boolean
        default: true

permissions:
  contents: read

env:
  SITE: https://mvtech.solutions
  INDEXNOW_KEY: a8d4c16a6f9eb474cceec847dbd37364

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect changed public URLs
        id: urls
        run: |
          FULL="${{ github.event_name == 'schedule' || inputs.full }}"
          if [ "$FULL" = "true" ]; then
            # Full sweep: every public URL in the sitemap, so nothing is left permanently unsubmitted.
            grep -o '<loc>[^<]*</loc>' sitemap.xml \
              | sed -E 's#</?loc>##g; s#^https://[^/]+##' \
              | sort -u > changed.txt
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=$(git rev-parse HEAD~1); fi
            git diff --name-only "$BEFORE" "${{ github.sha }}" -- '*/index.html' 'index.html' 'llms.txt' 'llms-full.txt' \
              | grep -v -E '^(content|scripts|partials|node_modules|docs)/' \
              | sed -E 's#^index\.html$#/#; s#/index\.html$#/#; s#^([^/])#/\1#' \
              | sort -u > changed.txt
          fi
          # Always include the sitemap so the crawler sees fresh lastmod values.
          echo "/sitemap.xml" >> changed.txt
          sort -u changed.txt -o changed.txt
          echo "Changed URLs:"; cat changed.txt
          node -e '
            const fs=require("fs");const site=process.env.SITE;
            const urls=fs.readFileSync("changed.txt","utf8").split(/\n/).filter(Boolean).map(p=>site+p).slice(0,10000);
            fs.writeFileSync("payload.json", JSON.stringify({host:new URL(site).host,key:process.env.INDEXNOW_KEY,keyLocation:`${site}/${process.env.INDEXNOW_KEY}.txt`,urlList:urls}));
          '
      - name: Wait for GitHub Pages to publish
        if: github.event_name == 'push'
        run: sleep 120
      - name: Submit to IndexNow
        run: |
          STATUS=$(curl -sS -o response.txt -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" --data @payload.json)
          echo "IndexNow responded with HTTP $STATUS"; cat response.txt || true
          case "$STATUS" in 200|202) exit 0;; *) echo "::warning::IndexNow submission returned HTTP $STATUS"; exit 0;; esac
