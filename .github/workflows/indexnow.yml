# Notifies participating IndexNow search engines about published URL changes.
# Acceptance is not a promise of crawling, indexing, ranking or inclusion in AI answers.
# Google uses the sitemap and Search Console instead of IndexNow.
name: Notify search engines (IndexNow)

on:
  push:
    branches: [main]
  # Periodic discovery backstop for URLs that have not been edited recently.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: 'Submit every sitemap URL instead of only changed pages'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  SITE: https://mvtech.solutions
  INDEXNOW_KEY: a8d4c16a6f9eb474cceec847dbd37364

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect changed public URLs
        id: urls
        run: |
          FULL="${{ github.event_name == 'schedule' || inputs.full }}"
          if [ "$FULL" = "true" ]; then
            # Full sweep: every public URL in the sitemap, so nothing is left permanently unsubmitted.
            grep -o '<loc>[^<]*</loc>' sitemap.xml \
              | sed -E 's#</?loc>##g; s#^https://[^/]+##' \
              | sort -u > changed.txt
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE=$(git rev-parse HEAD~1); fi
            git diff --name-only "$BEFORE" "${{ github.sha }}" -- '*/index.html' 'index.html' 'llms.txt' 'llms-full.txt' > changed-files.txt
            node -e '
              const fs=require("fs");
              const urls=fs.readFileSync("changed-files.txt","utf8").split(/\n/)
                .filter(p=>p && !/^(content|scripts|partials|node_modules|docs)\//.test(p))
                .map(p=>p==="index.html"?"/":"/"+p.replace(/\/index\.html$/,"/"));
              fs.writeFileSync("changed.txt",[...new Set(urls)].sort().join("\n")+"\n");
            '
          fi
          # Always include the sitemap so the crawler sees fresh lastmod values.
          echo "/sitemap.xml" >> changed.txt
          sort -u changed.txt -o changed.txt
          echo "Changed URLs:"; cat changed.txt
          node -e '
            const fs=require("fs");const site=process.env.SITE;
            const urls=fs.readFileSync("changed.txt","utf8").split(/\n/).filter(Boolean).map(p=>site+p).slice(0,10000);
            fs.writeFileSync("payload.json", JSON.stringify({host:new URL(site).host,key:process.env.INDEXNOW_KEY,keyLocation:`${site}/${process.env.INDEXNOW_KEY}.txt`,urlList:urls}));
          '
      - name: Wait for GitHub Pages to publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            STATE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")] | sort_by(.run_number) | last | if . == null then "pending" elif .status == "completed" then .conclusion else .status end')
            case "$STATE" in
              success) echo "GitHub Pages deployed this commit."; exit 0 ;;
              failure|cancelled|timed_out|action_required) echo "::error::GitHub Pages deployment ended with $STATE"; exit 1 ;;
            esac
            echo "Waiting for GitHub Pages ($STATE; attempt $attempt/20)."
            sleep 15
          done
          echo "::error::GitHub Pages did not finish deploying this commit within five minutes."
          exit 1
      - name: Submit to IndexNow
        run: |
          STATUS=$(curl -sS --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 -o response.txt -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" --data @payload.json)
          echo "IndexNow responded with HTTP $STATUS"; cat response.txt || true
          case "$STATUS" in 200|202) exit 0;; *) echo "::error::IndexNow submission returned HTTP $STATUS"; exit 1;; esac
